<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Note - NotesHive</title>
</head>
<body>
    <h2>Delete a Note</h2>
    <p><a href="/dashboard">Back to Dashboard</a> | <a href="/logout">Logout</a></p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if message %}
        <p style="color:green;">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/deletenote">
        <label>Note ID or Title:</label><br>
        <input type="text" name="note_identifier" required><br><br>

        <button type="submit">Delete Note</button>
    </form>
</body>
</html>
