<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Note - NotesHive</title>
</head>
<body>
    <h2>Add a New Note</h2>
    <p><a href="/dashboard">Back to Dashboard</a> | <a href="/logout">Logout</a></p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% if message %}
        <p style="color:green;">{{ message }}</p>
    {% endif %}

    <form method="POST" action="/addnote">
        <!-- Title -->
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <!-- Description (changed from 'content') -->
        <label>Description:</label><br>
        <textarea name="description" rows="5" cols="40" required></textarea><br><br>

        <!-- File URL (required) -->
        <label>File URL:</label><br>
        <input type="text" name="file_path" placeholder="https://drive.google.com/..." required><br><br>

        <!-- Subject: can use ID or Name -->
        <label>Subject ID (if known):</label><br>
        <input type="number" name="subject_id" placeholder="210"><br><br>

        <label>Or Subject Name (if ID not known):</label><br>
        <input type="text" name="subject_name" placeholder="DBMS"><br><br>

        <button type="submit">Add Note</button>
    </form>
</body>
</html>
